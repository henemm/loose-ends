# Loose Ends: Dienst für Claude (henemm/loose-ends#796, henemm-infra#336). Container loose-ends-server auf 127.0.0.1:8780.
# Nach außen gehen /health, /mcp, die drei /.well-known/…-Pfade (Resource- und Server-Metadaten) und /oauth/
# (Aussteller für claude.ai, loose-ends#621 S6b). /auth/* (App-Anmeldung, loose-ends#615 S4) und alles andere bleiben 404.
# Installiert als /etc/nginx/sites-available/loose-ends.henemm.com (Link in sites-enabled); 443-Blöcke von certbot.

# Eigene Zonen hier statt in conf.d/limit-req.conf (Schnitt auf wenige Dateien begrenzt); monitor.sh fragt alle 5 min.
limit_req_zone $binary_remote_addr zone=loose_ends_health:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=loose_ends_oauth:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=loose_ends_mcp:1m rate=10r/s;

server {
    server_name loose-ends.henemm.com;

    include snippets/security-headers.conf;

    # BREACH-Mitigation wie Frieda
    gzip off;

    location = /health {
        limit_req zone=loose_ends_health burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Konnektor für claude.ai (loose-ends#621 S6b); ohne Token antwortet der Dienst 401. Streaming (SSE) ungepuffert.
    location = /mcp {
        limit_req zone=loose_ends_mcp burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Discovery: Resource-Metadaten (RFC 9728) und Server-Metadaten (RFC 8414 / OpenID)
    location = /.well-known/oauth-protected-resource/mcp {
        limit_req zone=loose_ends_oauth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server {
        limit_req zone=loose_ends_oauth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/openid-configuration {
        limit_req zone=loose_ends_oauth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth-Aussteller: Autorisierung, Token, Anmeldung über Apple, Zustimmung
    location ^~ /oauth/ {
        limit_req zone=loose_ends_oauth burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App-Anmeldung bleibt zu bis loose-ends#615 S4
    location ^~ /auth/ {
        return 404;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/loose-ends.henemm.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/loose-ends.henemm.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = loose-ends.henemm.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name loose-ends.henemm.com;
    return 404; # managed by Certbot


}
