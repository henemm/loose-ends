.sm-ft span{font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.cell em{font-style:normal;font:500 11px -apple-system,system-ui,sans-serif;color:var(--label);text-shadow:0 1px 2px rgba(0,0,0,.18)}
