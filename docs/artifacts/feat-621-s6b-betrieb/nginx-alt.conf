# Loose Ends: Dienst für Claude (henemm/loose-ends#796, henemm-infra#336). Container loose-ends-server auf 127.0.0.1:8780.
# Nach außen geht nur /health. /mcp und alles andere bleiben 404, bis Anmeldung (loose-ends#615) und
# Konnektor (loose-ends#621) da sind; erst dann wird hier geöffnet.
# Installiert als /etc/nginx/sites-available/loose-ends.henemm.com (Link in sites-enabled); 443-Blöcke von certbot.

# Eigene Zone hier statt in conf.d/limit-req.conf (Schnitt auf fünf Dateien begrenzt); monitor.sh fragt alle 5 min.
limit_req_zone $binary_remote_addr zone=loose_ends_health:1m rate=30r/m;

server {
    server_name loose-ends.henemm.com;

    include snippets/security-headers.conf;

    # BREACH-Mitigation wie Frieda
    gzip off;

    location = /health {
        limit_req zone=loose_ends_health burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gesperrt bis loose-ends#615 (Anmeldung) und #621 (Konnektor)
    location = /mcp {
        return 404;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/loose-ends.henemm.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/loose-ends.henemm.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = loose-ends.henemm.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name loose-ends.henemm.com;
    return 404; # managed by Certbot


}
