# agent-os-openspec project configuration for Loose Ends
# Docs: https://github.com/henemm/agent-os-openspec

framework:
  enabled: true

workflow:
  # Henning gibt mit „Go" frei — das ist seine natürliche Formulierung und war bisher nur als
  # GREEN-Wort hinterlegt, nicht als Spec-Freigabe. Ihn ein anderes Wort tippen zu lassen wäre
  # das Weiterreichen eines Werkzeugproblems; also lernt das Werkzeug sein Wort.
  approval_phrases: ["go", "approved", "freigabe", "spec ok", "lgtm", "looks good", "genehmigt", "abgenommen", "passt"]

strict_code_gate:
  code_extensions: [".swift"]
  # Edits here never need an active workflow: tests, docs, tooling.
  always_allowed_dirs: ["LooseEndsTests/", "LooseEndsUITests/", "docs/", "scripts/"]

scope_guard:
  max_loc_delta: 250
  # Generated or declarative files do not count against the production-code budget.
  loc_exclude_patterns:
    - "\\.xcstrings$"
    - "\\.xcassets/"
    - "^docs/"
    - "^project\\.yml$"
    - "\\.entitlements$"
    - "Info\\.plist$"
    - "^\\.github/"
    # Data of the measuring instrument (#67): raw results fetched from the iPhone and the corpus itself.
    - "^Measurement/results/"
    - "^Measurement/date-title-corpus\\.json$"
  max_test_loc_delta: 500
  test_path_patterns: ["^LooseEndsTests/", "^LooseEndsUITests/"]

secrets_guard:
  # SwiftUI uses `.environment` and `.environmentObject` everywhere; the bare `\.env` pattern
  # blocks routine greps in Swift code. Word-boundary form until the plugin ships the same fix.
  sensitive_patterns: ["\\.env(rc)?\\b", "credentials\\.json", "service[_-]?account.*\\.json", "private[_.]key", "[_.]secret\\.", "\\.pem$", "\\.key$"]
