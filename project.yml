# Generate the Xcode project with: xcodegen generate
# Never edit the generated .xcodeproj by hand; edit this file and regenerate.
name: LooseEnds
options:
  bundleIdPrefix: com.henning
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    watchOS: "27.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Xcode merkt sich das Team NICHT: es steht in LooseEnds.xcodeproj, und die
    # Datei wird bei jedem `xcodegen generate` neu geschrieben. Ein leerer Wert
    # heißt deshalb: nach jedem neuen Stand verweigert Xcode den Start auf einem
    # echten Gerät ("requires a development team"). Darum steht das Team hier.
    DEVELOPMENT_TEAM: "XK87E2B3VR"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    # Prüfkennung (#156, ADR-18): leer für jeden normalen Bau (Xcode-„Run", Simulator, CI,
    # Release). Nur `sim.sh device-build` überschreibt beides auf der Kommandozeile, damit ein
    # Gerätebau nie unter Hennings Kennung, App-Gruppe oder iCloud-Container installiert.
    BUNDLE_ID_SUFFIX: ""
    LE_DISPLAY_NAME: Loose Ends

targets:
  LooseEnds:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - LooseEnds
      - Shared
    dependencies:
      - target: LooseEndsWatch
        platformFilter: iOS      # a watch app can only be embedded in the iOS build
      - target: LooseEndsWidgets
      - target: LooseEndsShare
        platformFilter: iOS      # the Mac share extension is a later slice
      - sdk: CloudKit.framework
        destinationFilters: [macOS]   # macOS builds don't link it by default, mirroring may never start (#377)
    entitlements:
      path: LooseEnds/LooseEnds.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.henning.looseends$(BUNDLE_ID_SUFFIX)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.henning.looseends$(BUNDLE_ID_SUFFIX)]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        # Siri (#347): without it Siri ignores INAlternativeAppNames — build 43 answered „Loose End
        # ist nicht installiert“ although „Loose End“ was declared. The App ID has had the Siri
        # capability since setup (docs/reference/testflight.md, step 2).
        com.apple.developer.siri: true
        # iCloud key-value store: DueNotificationCenter syncs the reminder time across devices (#311).
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # CloudKit mirroring pushes silently; without this the device never hears about a change
        # made elsewhere. Xcode swaps the value for "production" on an App Store export.
        aps-environment: development
    info:
      path: LooseEnds/Info.plist
      properties:
        CFBundleDisplayName: $(LE_DISPLAY_NAME)
        CFBundleName: Loose Ends
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LEAppGroup: group.com.henning.looseends$(BUNDLE_ID_SUFFIX)
        LECloudContainer: iCloud.com.henning.looseends$(BUNDLE_ID_SUFFIX)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        LSApplicationCategoryType: public.app-category.productivity   # the Mac App Store upload requires a category (#389)
        # Required alongside aps-environment, or CloudKit logs
        # "BUG IN CLIENT OF CLOUDKIT: CloudKit push notifications require the
        # 'remote-notification' background mode" and sync only catches up on a cold start.
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false   # no custom crypto: TestFlight skips the export-compliance question
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Loose Ends listens so you can say a task instead of typing it.
        NSSpeechRecognitionUsageDescription: Speech is turned into text on your device to capture a task.
        NSCalendarsFullAccessUsageDescription: Only if you switch it on, a task with a due date is shown in "Loose Ends" or in a calendar you pick. The app only changes its own events.
        NSUserActivityTypes: [com.henning.looseends.capture]
        # Siri's name for the app (#347): a German Siri did not recognise "Loose Ends" in build 43 —
        # the hints were English only. Names and hints are variables, filled per language from
        # LooseEnds/Resources/<lang>.lproj/InfoPlist.strings (Apple: "Specifying synonyms for your
        # app name"); CFBundleSpokenName there gives the display name its German pronunciation.
        CFBundleSpokenName: Loose Ends
        INAlternativeAppNames:
          - INAlternativeAppName: LE_ALT_NAME_1
            INAlternativeAppNamePronunciationHint: LE_ALT_HINT_1
          - INAlternativeAppName: LE_ALT_NAME_2
            INAlternativeAppNamePronunciationHint: LE_ALT_HINT_2
          - INAlternativeAppName: LE_ALT_NAME_3
            INAlternativeAppNamePronunciationHint: LE_ALT_HINT_3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends$(BUNDLE_ID_SUFFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LooseEndsWatch:
    type: application
    platform: watchOS
    sources:
      - LooseEndsWatch
      - Shared
    entitlements:
      path: LooseEndsWatch/LooseEndsWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.henning.looseends$(BUNDLE_ID_SUFFIX)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.henning.looseends$(BUNDLE_ID_SUFFIX)]
        aps-environment: development   # the watch mirrors the same store and needs its own pushes
    info:
      path: LooseEndsWatch/Info.plist
      properties:
        CFBundleDisplayName: $(LE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LEAppGroup: group.com.henning.looseends$(BUNDLE_ID_SUFFIX)
        LECloudContainer: iCloud.com.henning.looseends$(BUNDLE_ID_SUFFIX)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [remote-notification]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.henning.looseends$(BUNDLE_ID_SUFFIX)
        WKRunsIndependentlyOfCompanionApp: true
        NSMicrophoneUsageDescription: Loose Ends listens so you can say a task.
        NSSpeechRecognitionUsageDescription: Speech is turned into text on your watch to capture a task.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends$(BUNDLE_ID_SUFFIX).watchkitapp

  LooseEndsWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - LooseEndsWidgets
      # Capture runs in the app process only (#326): iOS runs an intent compiled into several
      # bundles in any of them when the app is not running. In the widget, which has no iCloud
      # and opens the store without sync, "Aufgabe erfassen" failed with "Kurzbefehle konnte keine
      # Kommunikation mit der App herstellen".
      - path: Shared
        excludes:
          - Intents/CaptureTextIntent.swift
    entitlements:
      path: LooseEndsWidgets/LooseEndsWidgets.entitlements
      properties:
        # No iCloud here: the CI key cannot add the capability to the widget's identifier (TestFlight
        # build 26 failed, #307). The widget opens the store without sync (`make(syncs: false)`).
        com.apple.security.application-groups: [group.com.henning.looseends$(BUNDLE_ID_SUFFIX)]
        com.apple.security.app-sandbox: true
    info:
      path: LooseEndsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Loose Ends Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LEAppGroup: group.com.henning.looseends$(BUNDLE_ID_SUFFIX)
        LECloudContainer: iCloud.com.henning.looseends$(BUNDLE_ID_SUFFIX)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends$(BUNDLE_ID_SUFFIX).widgets

  LooseEndsShare:
    type: app-extension
    platform: iOS
    sources:
      - LooseEndsShare
      # No App Intents in the share extension (#326): see the widget target.
      - path: Shared
        excludes:
          - Intents/CaptureTextIntent.swift
          - Intents/NextUpWidgetIntents.swift
    entitlements:
      path: LooseEndsShare/LooseEndsShare.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.henning.looseends$(BUNDLE_ID_SUFFIX)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.henning.looseends$(BUNDLE_ID_SUFFIX)]
    info:
      path: LooseEndsShare/Info.plist
      properties:
        CFBundleDisplayName: $(LE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LEAppGroup: group.com.henning.looseends$(BUNDLE_ID_SUFFIX)
        LECloudContainer: iCloud.com.henning.looseends$(BUNDLE_ID_SUFFIX)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Text, links and mails (what Mail's share sheet hands over).
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a, ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.email-message").@count >= 1).@count >= 1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends$(BUNDLE_ID_SUFFIX).share

  # Messprogramm für die Spikes: eine eigene, wegwerfbare App auf Hennings iPhone. Sie misst in
  # Scheiben, wann immer er sie öffnet, und rührt die echten Daten nicht an — keine App-Gruppe,
  # kein CloudKit. Nur der Veredeler und die Aufzählungen, die er braucht.
  LooseEndsLab:
    type: application
    platform: iOS
    sources:
      - LooseEndsLab
      - Measurement
      - path: Shared/Enrichment/EnrichmentDraft.swift
      - path: Shared/Enrichment/FoundationModelsEnricher.swift
      - path: Shared/Models/Enums.swift
      # Der geteilte Tokenizer (#136): Measurement/ trägt bewusst kein `import LooseEnds`, ruft aber
      # RawTextWords auf — die Datei muss deshalb in jedes Ziel, das Measurement/ als Quelle listet.
      - path: Shared/Services/RawTextWords.swift
    info:
      path: LooseEndsLab/Info.plist
      properties:
        CFBundleDisplayName: LE Labor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Kein Hintergrundmodus (#83): am Akku drosselt Apple Hintergrundanfragen nach wenigen
        # Aufrufen, gemessen wird deshalb nur im Vordergrund bei wachem Bildschirm.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends.lab

  LooseEndsTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - LooseEndsTests
      - Measurement
      - path: Shared/Services/RawTextWords.swift   # s. LooseEndsLab (#136)
    dependencies:
      - target: LooseEnds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends.tests
        # Signing a test bundle for a real device needs an Info.plist; for the simulator,
        # which never signs, the missing file went unnoticed.
        GENERATE_INFOPLIST_FILE: YES
        # Multiplatform host app: the macOS bundle layout differs from iOS.
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/LooseEnds.app/Contents/MacOS/LooseEnds
        BUNDLE_LOADER[sdk=macosx*]: $(TEST_HOST)
        # A real iPhone runs no test without a host app ("Logic Testing Unavailable"); the
        # simulator does, which is why this stayed unnoticed until the measurements of #67
        # had to run on the reference device.
        TEST_HOST[sdk=iphoneos*]: $(BUILT_PRODUCTS_DIR)/LooseEnds.app/LooseEnds
        BUNDLE_LOADER[sdk=iphoneos*]: $(TEST_HOST)

  LooseEndsUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - LooseEndsUITests
      - Measurement   # the same corpus feeds the Reminders benchmark (#78)
      - path: Shared/Services/RawTextWords.swift   # s. LooseEndsLab (#136)
    dependencies:
      - target: LooseEnds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LooseEnds:
    build:
      targets:
        LooseEnds: all
        LooseEndsTests: [test]
        LooseEndsUITests: [test]
    test:
      targets: [LooseEndsTests, LooseEndsUITests]
      gatherCoverageData: true
