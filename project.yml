# Generate the Xcode project with: xcodegen generate
# Never edit the generated .xcodeproj by hand; edit this file and regenerate.
name: LooseEnds
options:
  bundleIdPrefix: com.henning
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    watchOS: "27.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Xcode merkt sich das Team NICHT: es steht in LooseEnds.xcodeproj, und die
    # Datei wird bei jedem `xcodegen generate` neu geschrieben. Ein leerer Wert
    # heißt deshalb: nach jedem neuen Stand verweigert Xcode den Start auf einem
    # echten Gerät ("requires a development team"). Darum steht das Team hier.
    DEVELOPMENT_TEAM: "XK87E2B3VR"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true

targets:
  LooseEnds:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - LooseEnds
      - Shared
    dependencies:
      - target: LooseEndsWatch
        platformFilter: iOS      # a watch app can only be embedded in the iOS build
      - target: LooseEndsWidgets
      - target: LooseEndsShare
        platformFilter: iOS      # the Mac share extension is a later slice
    entitlements:
      path: LooseEnds/LooseEnds.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.henning.looseends]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.henning.looseends]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        # CloudKit mirroring pushes silently; without this the device never hears about a change
        # made elsewhere. Xcode swaps the value for "production" on an App Store export.
        aps-environment: development
    info:
      path: LooseEnds/Info.plist
      properties:
        CFBundleDisplayName: Loose Ends
        CFBundleName: Loose Ends
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Required alongside aps-environment, or CloudKit logs
        # "BUG IN CLIENT OF CLOUDKIT: CloudKit push notifications require the
        # 'remote-notification' background mode" and sync only catches up on a cold start.
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false   # no custom crypto: TestFlight skips the export-compliance question
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Loose Ends listens so you can say a task instead of typing it.
        NSSpeechRecognitionUsageDescription: Speech is turned into text on your device to capture a task.
        NSCalendarsFullAccessUsageDescription: Only if you switch it on, a task with a due date is shown in a "Loose Ends" calendar. The app never reads your other events.
        NSUserActivityTypes: [com.henning.looseends.capture]
        INAlternativeAppNames:
          - INAlternativeAppName: Loose End
            INAlternativeAppNamePronunciationHint: loose end
          - INAlternativeAppName: LooseEnds
            INAlternativeAppNamePronunciationHint: loose ends
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LooseEndsWatch:
    type: application
    platform: watchOS
    sources:
      - LooseEndsWatch
      - Shared
    entitlements:
      path: LooseEndsWatch/LooseEndsWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.henning.looseends]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.henning.looseends]
        aps-environment: development   # the watch mirrors the same store and needs its own pushes
    info:
      path: LooseEndsWatch/Info.plist
      properties:
        CFBundleDisplayName: Loose Ends
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [remote-notification]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.henning.looseends
        WKRunsIndependentlyOfCompanionApp: true
        NSMicrophoneUsageDescription: Loose Ends listens so you can say a task.
        NSSpeechRecognitionUsageDescription: Speech is turned into text on your watch to capture a task.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends.watchkitapp

  LooseEndsWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - LooseEndsWidgets
      - Shared
    entitlements:
      path: LooseEndsWidgets/LooseEndsWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.henning.looseends]
        com.apple.security.app-sandbox: true
    info:
      path: LooseEndsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Loose Ends Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends.widgets

  LooseEndsShare:
    type: app-extension
    platform: iOS
    sources:
      - LooseEndsShare
      - Shared
    entitlements:
      path: LooseEndsShare/LooseEndsShare.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.henning.looseends]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.henning.looseends]
    info:
      path: LooseEndsShare/Info.plist
      properties:
        CFBundleDisplayName: Loose Ends
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Text, links and mails (what Mail's share sheet hands over).
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a, ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.email-message").@count >= 1).@count >= 1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends.share

  LooseEndsTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - LooseEndsTests
    dependencies:
      - target: LooseEnds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends.tests
        # Multiplatform host app: the macOS bundle layout differs from iOS.
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/LooseEnds.app/Contents/MacOS/LooseEnds
        BUNDLE_LOADER[sdk=macosx*]: $(TEST_HOST)

  LooseEndsUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - LooseEndsUITests
    dependencies:
      - target: LooseEnds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henning.looseends.uitests

schemes:
  LooseEnds:
    build:
      targets:
        LooseEnds: all
        LooseEndsTests: [test]
        LooseEndsUITests: [test]
    test:
      targets: [LooseEndsTests, LooseEndsUITests]
      gatherCoverageData: true
