name: CI

on:
  push:
    branches: [main]
  pull_request:   # every PR, including stacked ones whose base is another feature branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Until the macos-26 image ships Xcode 27, every job lowers the deployment targets in project.yml
# to 26.0 before generating the project. A command-line override is not enough: xcodebuild filters
# simulator destinations by the project's deployment target, so a 27.0 project sees no iOS 26 simulator.
# iOS-27-only APIs must be guarded with #available until then (see CLAUDE.md).

jobs:
  unit-tests:
    name: Unit Tests (macOS destination)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (27 when the image has it)
        run: |
          latest=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          else
            sed -i '' 's/"27\.0"/"26.0"/g' project.yml
            echo "No Xcode 27 on this image: deployment targets lowered to 26.0 for this run."
          fi
          xcode-select -p && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project LooseEnds.xcodeproj \
            -scheme LooseEnds \
            -destination 'platform=macOS' \
            -only-testing:LooseEndsTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            2>&1 | tee unit-tests.log | xcbeautify
      - name: Show crash and failure details
        if: failure()
        run: grep -n -E -i "crash|fatal error|restarting after|failed|error:" unit-tests.log | grep -v -E "^\S+:\s*$" | head -120 || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            unit-tests.log
          if-no-files-found: warn

  ios-build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (27 when the image has it)
        run: |
          latest=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          else
            sed -i '' 's/"27\.0"/"26.0"/g' project.yml
            echo "No Xcode 27 on this image: deployment targets lowered to 26.0 for this run."
          fi
          xcode-select -p && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project LooseEnds.xcodeproj \
            -scheme LooseEnds \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            | xcbeautify

  ui-smoke:
    name: UI Smoke (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (27 when the image has it)
        run: |
          latest=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          else
            sed -i '' 's/"27\.0"/"26.0"/g' project.yml
            echo "No Xcode 27 on this image: deployment targets lowered to 26.0 for this run."
          fi
          xcode-select -p && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          devs=[d for v in json.load(sys.stdin)["devices"].values() for d in v]
          hit=next((d for d in devs if d["name"]=="iPhone 17"), None) or next((d for d in devs if d["name"].startswith("iPhone")), None)
          print(hit["udid"] if hit else "")')
          [ -n "$udid" ] || { echo "no iPhone simulator on this image"; xcrun simctl list devices available; exit 1; }
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid" || true
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project LooseEnds.xcodeproj \
            -scheme LooseEnds \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:LooseEndsUITests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            2>&1 | tee ui-smoke.log | xcbeautify
      - name: Show crash and failure details
        if: failure()
        run: grep -n -E -i "crash|fatal error|restarting after|failed|error:" ui-smoke.log | head -120 || true
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UITestResults
          path: |
            UITestResults.xcresult
            ui-smoke.log
          if-no-files-found: warn
