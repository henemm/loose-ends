name: CI

on:
  push:
    branches: [main]
  pull_request:   # every PR, including stacked ones whose base is another feature branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# #178: every job runs on the preview image xcode-27 and pins Xcode 27.0 through the composite action
# .github/actions/select-xcode-27, which stops the run on any other version. The deployment targets
# are built as checked in; nothing lowers them. If the xcode-27 label goes away or is renamed, follow
# docs/reference/testflight.md and adjust runs-on here, in speech-stress.yml and in testflight.yml.

jobs:
  unit-tests:
    name: Unit Tests (macOS destination)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.0
        uses: ./.github/actions/select-xcode-27
      # #185: the Python tests of the scripts in scripts/ (sim.sh proof, App Store Connect, CI),
      # first and cheap, so a broken script turns the run red before Xcode starts.
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project LooseEnds.xcodeproj \
            -scheme LooseEnds \
            -destination 'platform=macOS' \
            -only-testing:LooseEndsTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            2>&1 | tee unit-tests.log | xcbeautify
      - name: Show crash and failure details
        if: failure()
        run: grep -n -E -i "crash|fatal error|restarting after|failed|error:" unit-tests.log | grep -v -E "^\S+:\s*$" | head -120 || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            unit-tests.log
          if-no-files-found: warn

  ios-build:
    name: Build (iOS Simulator)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.0
        uses: ./.github/actions/select-xcode-27
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project LooseEnds.xcodeproj \
            -scheme LooseEnds \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            | xcbeautify

  ui-smoke:
    name: UI Smoke (iOS Simulator)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.0
        uses: ./.github/actions/select-xcode-27
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a simulator (iPhone 17, iOS 27.0 only)
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          devs=json.load(sys.stdin).get("devices", {}).get("com.apple.CoreSimulator.SimRuntime.iOS-27-0", [])
          hit=next((d for d in devs if d["name"]=="iPhone 17"), None)
          print(hit["udid"] if hit else "")')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 17 simulator with iOS 27.0 on this image. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid" || true
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Diagnose toolchain and simulator
        continue-on-error: true
        run: |
          xcodebuild -version || true
          xcrun simctl list runtimes || true
          xcrun simctl list devices available | grep "$SIM_UDID" || true
      - name: Run UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project LooseEnds.xcodeproj \
            -scheme LooseEnds \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:LooseEndsUITests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            2>&1 | tee ui-smoke.log | xcbeautify
      - name: Diagnose model availability
        if: always()
        continue-on-error: true
        run: |
          # EnrichmentCoordinator logs "Model unavailable, rules only: <reason>" or "Enriched <id>: N fields".
          xcrun simctl spawn "$SIM_UDID" log show --info --style compact --last 2h \
            --predicate 'subsystem == "com.henning.looseends" AND category == "Enrichment"' \
            > enrichment.log 2>&1 || true
          unavailable=$(grep -c "Model unavailable" enrichment.log || true)
          enriched=$(grep -c "Enriched " enrichment.log || true)
          echo "Model unavailable: ${unavailable:-0} lines, Enriched: ${enriched:-0} lines"
          grep -E "Model unavailable|Enriched " enrichment.log | head -20 || true
          if [ "${unavailable:-0}" -eq 0 ] && [ "${enriched:-0}" -eq 0 ]; then
            echo "Modellverfügbarkeit nicht erhebbar"
          fi
      - name: Show crash and failure details
        if: failure()
        run: grep -n -E -i "crash|fatal error|restarting after|failed|error:" ui-smoke.log | head -120 || true
      - name: Export design gallery
        if: always()
        continue-on-error: true
        run: |
          # #182: the screenshots DesignGalleryTests attaches, under their attachment names.
          mkdir -p gallery-raw DesignGallery
          xcrun xcresulttool export attachments --path UITestResults.xcresult --output-path gallery-raw
          python3 - <<'PY'
          import json, pathlib, shutil
          raw, out = pathlib.Path("gallery-raw"), pathlib.Path("DesignGallery")
          for test in json.loads((raw / "manifest.json").read_text()):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName", "")
                  if name.startswith("gallery-"):
                      stem = name.split("_")[0]
                      shutil.copy(raw / a["exportedFileName"], out / f"{stem}.png")
          print("\n".join(sorted(p.name for p in out.iterdir())) or "no gallery screenshots")
          PY
      - name: Upload design gallery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DesignGallery
          path: DesignGallery
          if-no-files-found: warn
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UITestResults
          path: |
            UITestResults.xcresult
            ui-smoke.log
          if-no-files-found: warn
