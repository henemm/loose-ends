name: TestFlight

# Archives the iOS app with cloud-managed signing and uploads it to TestFlight.
# Needs four repository secrets (docs/reference/testflight.md walks through creating them):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
# Run it by hand from the Actions tab, or push a tag like v0.1.0.
# Builds on the xcode-27 preview image with Xcode 27.0 pinned; stops instead of building with
# another toolchain (#174).

on:
  workflow_dispatch:
    inputs:
      cleanup_dry_run:
        description: Zertifikate nur auflisten, nichts widerrufen
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload (iOS)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are in place
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is missing"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_PRIVATE_KEY }}" ]; then echo "::error::Repository secret ASC_PRIVATE_KEY is missing"; missing=1; fi
          [ "$missing" = 0 ] || { echo "See docs/reference/testflight.md"; exit 1; }

      - name: Select Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version
          version=$(xcodebuild -version | sed -n 1p)   # sed liest bis zum Ende: kein SIGPIPE unter pipefail
          if [ "$version" != "Xcode 27.0" ]; then
            echo "::error::Expected Xcode 27.0 at /Applications/Xcode_27.app, got: $version. Not building an older or beta toolchain. See docs/reference/testflight.md"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Store the App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Every run on a fresh runner makes Xcode create an Apple Development certificate "Created via
      # API" whose private key is lost with the runner. Revoke what earlier runs left behind (#191).
      - name: Clear leftover development certificates
        env:
          DRY: ${{ inputs.cleanup_dry_run == true && '--dry-run' || '' }}
        run: |
          ASC_KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" python3 scripts/asc_cleanup_certs.py $DRY

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LooseEnds.xcodeproj \
            -scheme LooseEnds \
            -destination 'generic/platform=iOS' \
            -archivePath build/LooseEnds.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log | xcbeautify

      # Proves every target links against the 27 SDKs with the run's build number, dSYMs and
      # privacy strings. Runs locally too: ARCHIVE=<path> BUILD=<number> (docs/reference/testflight.md).
      - name: Verify the archive is built against the iOS 27 SDK
        env:
          BUILD: ${{ github.run_number }}
        run: |
          ARCHIVE="${ARCHIVE:-build/LooseEnds.xcarchive}"
          BUILD="${BUILD:?BUILD (build number) must be set}"
          MARKETING="0.1.0"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          row() { printf '%s\n' "$1" | tee -a "$SUMMARY"; }   # Protokoll und Zusammenfassung (#183)
          APPS="$ARCHIVE/Products/Applications"
          [ -d "$APPS" ] || { echo "::error::No Products/Applications in $ARCHIVE"; exit 1; }
          fail=0
          row "| Ziel | Bundle | DTSDKName | Minimum | Version | dSYM | Ergebnis |"
          row "|------|--------|-----------|---------|---------|------|----------|"
          get() { plutil -extract "$1" raw "$2" 2>/dev/null || true; }
          check() { # Bundle-Kennung, SDK-Präfix, Pflichtschlüssel (Schlüssel oder Schlüssel=Wert) ...
            local id="$1" sdk="$2" p found="" name mini ver dsym res=OK key want have
            shift 2
            while IFS= read -r bundle; do
              [ "$(get CFBundleIdentifier "$bundle/Info.plist")" = "$id" ] && { found="$bundle"; break; }
            done < <(find "$APPS" \( -name '*.app' -o -name '*.appex' \))
            if [ -z "$found" ]; then
              row "| $id | fehlt im Archiv | - | - | - | - | FEHLER |"
              echo "::error::Target $id not found in the archive"; fail=1; return
            fi
            p="$found/Info.plist"
            name=$(get DTSDKName "$p"); mini=$(get MinimumOSVersion "$p")
            ver="$(get CFBundleShortVersionString "$p") ($(get CFBundleVersion "$p"))"
            dsym=da; [ -d "$ARCHIVE/dSYMs/$(basename "$found").dSYM" ] || dsym=fehlt
            case "$name" in "$sdk"*) ;; *) res=FEHLER; echo "::error::$id linked against '$name', expected $sdk*" ;; esac
            [ "$mini" = "27.0" ] || { res=FEHLER; echo "::error::$id minimum '$mini', expected 27.0"; }
            [ "$ver" = "$MARKETING ($BUILD)" ] || { res=FEHLER; echo "::error::$id version '$ver', expected $MARKETING ($BUILD)"; }
            [ "$dsym" = da ] || { res=FEHLER; echo "::error::$id has no dSYM in the archive"; }
            for key in "$@"; do
              want=""; [ "${key#*=}" != "$key" ] && { want="${key#*=}"; key="${key%%=*}"; }
              have=$(get "$key" "$p")
              if [ -z "$have" ] || { [ -n "$want" ] && [ "$have" != "$want" ]; }; then
                res=FEHLER; echo "::error::$id: $key is '$have'${want:+, expected $want}"
              fi
            done
            row "| $id | ${found#$APPS/} | $name | $mini | $ver | $dsym | $res |"
            [ "$res" = OK ] || fail=1
          }
          check com.henning.looseends iphoneos27. NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription \
            NSCalendarsFullAccessUsageDescription ITSAppUsesNonExemptEncryption=false
          check com.henning.looseends.watchkitapp watchos27. NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription
          check com.henning.looseends.widgets iphoneos27.
          check com.henning.looseends.share iphoneos27.
          [ "$fail" = 0 ]

      - name: Write export options
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/LooseEnds.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log | xcbeautify

      - name: Show what went wrong
        if: failure()
        run: grep -n -E -i "error|failed|provisioning|entitlement" archive.log upload.log 2>/dev/null | head -80 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs
          path: |
            archive.log
            upload.log
          if-no-files-found: warn

      # Revokes what this run created, also when archive, proof or export failed (#191).
      # continue-on-error: a failed revoke (401/403/5xx, network) marks only this step, so the job
      # stays green and `confirm` still checks the uploaded build (#183). Leftovers are cleared by
      # the next run before its archive. The cleanup before the archive keeps failing fast.
      - name: Clear the development certificates of this run
        if: always()
        continue-on-error: true
        env:
          DRY: ${{ inputs.cleanup_dry_run == true && '--dry-run' || '' }}
        run: |
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          [ -f "$KEY" ] || { echo "No API key stored, nothing to clear"; exit 0; }
          ASC_KEY_FILE="$KEY" python3 scripts/asc_cleanup_certs.py $DRY

      - name: Remove the key
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

  # "Upload succeeded" only means Apple received the package. This job waits on ubuntu (no macOS
  # minutes) until App Store Connect reports the build as VALID; only this job turns red (#183).
  confirm:
    name: Confirm Apple processed the build
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait until App Store Connect reports the build as VALID
        env:
          BUILD: ${{ github.run_number }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_wait_build.py "$BUILD"
