# Handlauf (#837 Schnitt 2, #893 D): liest Name, Untertitel und Datenschutz-Adresse der App-Informationen, setzt den
# Untertitel aus docs/reference/app-store-untertitel.md oder die Datenschutz-Adresse je Sprache. Schreibt nur in die eine
# App-Info im Zustand PREPARE_FOR_SUBMISSION, nur bei Abweichung (en-US wird nur von untertitel mit Name angelegt, wenn es
# fehlt); reicht nichts ein.
name: ASC App Info

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "lesen = nur Zustand zeigen, untertitel = Untertitel setzen, datenschutz = Datenschutz-Adresse setzen (beides nur bei Abweichung)"
        type: choice
        options:
          - lesen
          - untertitel
          - datenschutz
        default: lesen

permissions:
  contents: read

jobs:
  app-info:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_POLL_SECONDS: "5"
      AKTION: ${{ inputs.aktion }}
      ASC_PRIVACY_POLICY_URL: ${{ vars.ASC_PRIVACY_POLICY_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 scripts/test_asc_app_info.py
      - name: App info
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_app_info.py "$AKTION"
