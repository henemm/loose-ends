# Handlauf (#705): `aktion=probe` (Standard, Schnitt 1) fragt Apples Beta-Seite der App nur lesend ab und druckt die
# Belegtabelle je Plattform in den Lauf-Log. `aktion=einrichten` (Schnitt 2a) setzt vorher Beta-Beschreibung,
# Feedback-E-Mail und Review-Kontakt (nur aus Secrets, das Repo ist öffentlich); die Probe danach ist der Beleg.
# `aktion=zuordnen` (Schnitt 2b-1) legt die externe Gruppe `Tester` an (Link aus) und ordnet ihr je Plattform den
# neuesten gültigen Build zu; keine Einreichung zum Review. Die Probe danach ist der Beleg.
# `aktion=einreichen` (Schnitt 2b-2b) ordnet ebenso zu und reicht den Build je Plattform einmal zum Beta-Review ein
# (nicht rücknehmbar, nur nach Hennings Wort). Die Probe danach ist der Beleg.
# `aktion=link` (Schnitt 2b-2c) schaltet den öffentlichen Link der Gruppe `Tester` mit Limit 50 ein, nur wenn je Plattform
# der neueste gültige Build in der Gruppe liegt und freigegeben ist (nur nach Hennings Wort); `aktion=link-aus` schaltet
# ihn wieder aus. Der Link steht nie im Log. Die Probe danach ist der Beleg.
# Läuft nie automatisch.
name: ASC Beta Probe

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "probe = nur lesen, einrichten = Texte und Kontakt setzen, zuordnen = Gruppe und Builds, dann lesen, einreichen = Zuordnen und Beta-Review einreichen (nicht rücknehmbar), link = öffentlichen Link einschalten (Limit 50, nur nach Hennings Wort), link-aus = wieder ausschalten"
        type: choice
        options:
          - probe
          - einrichten
          - zuordnen
          - einreichen
          - link
          - link-aus
        default: probe

permissions:
  contents: read

jobs:
  setup:
    name: Set beta description, feedback email and review contact
    if: ${{ inputs.aktion == 'einrichten' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_REVIEW_FIRST_NAME: ${{ secrets.ASC_REVIEW_FIRST_NAME }}
      ASC_REVIEW_LAST_NAME: ${{ secrets.ASC_REVIEW_LAST_NAME }}
      ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
      ASC_REVIEW_EMAIL: ${{ secrets.ASC_REVIEW_EMAIL }}
      ASC_PRIVACY_POLICY_URL: ${{ vars.ASC_PRIVACY_POLICY_URL }}
      ASC_PRIVACY_POLICY_URL_EN: ${{ vars.ASC_PRIVACY_POLICY_URL_EN }}
      ASC_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7
      - name: Write localization de-DE and review detail where they differ
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_beta_setup.py

  assign:
    name: Create external group Tester and assign the newest valid builds
    # setup ist bei `zuordnen` übersprungen; ohne !cancelled() würde assign mit übersprungen
    needs: setup
    if: ${{ !cancelled() && inputs.aktion == 'zuordnen' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7
      - name: Create the group if missing, assign builds where missing
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_beta_invite.py

  submit:
    name: Assign the newest valid builds and submit them to Beta App Review
    needs: setup
    if: ${{ !cancelled() && inputs.aktion == 'einreichen' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7
      - name: Assign where missing, submit where ready and not yet submitted
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_beta_invite.py --einreichen

  link:
    name: Switch the public link of group Tester on (limit 50) or off
    needs: setup
    if: ${{ !cancelled() && (inputs.aktion == 'link' || inputs.aktion == 'link-aus') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7
      - name: Switch the link on where every platform is approved
        if: ${{ inputs.aktion == 'link' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_beta_link.py
      - name: Switch the link off
        if: ${{ inputs.aktion == 'link-aus' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_beta_link.py --aus

  probe:
    name: Probe Apple's beta side (${{ matrix.platform }})
    needs: [setup, assign, submit, link]
    if: ${{ !cancelled() && (needs.setup.result == 'success' || needs.setup.result == 'skipped') && (needs.assign.result == 'success' || needs.assign.result == 'skipped') && (needs.submit.result == 'success' || needs.submit.result == 'skipped') && (needs.link.result == 'success' || needs.link.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [IOS, MAC_OS]
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PLATFORM: ${{ matrix.platform }}
      ASC_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7
      - name: Read groups, localizations, review detail, builds and submissions
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_beta_probe.py
