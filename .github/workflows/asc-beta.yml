# Handlauf (#705): `aktion=probe` (Standard, Schnitt 1) fragt Apples Beta-Seite der App nur lesend ab und druckt die
# Belegtabelle je Plattform in den Lauf-Log. `aktion=einrichten` (Schnitt 2a) setzt vorher Beta-Beschreibung,
# Feedback-E-Mail und Review-Kontakt (nur aus Secrets, das Repo ist öffentlich); die Probe danach ist der Beleg.
# Läuft nie automatisch.
name: ASC Beta Probe

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "probe = nur lesen, einrichten = Texte und Kontakt setzen, dann lesen"
        type: choice
        options:
          - probe
          - einrichten
        default: probe

permissions:
  contents: read

jobs:
  setup:
    name: Set beta description, feedback email and review contact
    if: ${{ inputs.aktion == 'einrichten' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_REVIEW_FIRST_NAME: ${{ secrets.ASC_REVIEW_FIRST_NAME }}
      ASC_REVIEW_LAST_NAME: ${{ secrets.ASC_REVIEW_LAST_NAME }}
      ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
      ASC_REVIEW_EMAIL: ${{ secrets.ASC_REVIEW_EMAIL }}
      ASC_PRIVACY_POLICY_URL: ${{ vars.ASC_PRIVACY_POLICY_URL }}
      ASC_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7
      - name: Write localization de-DE and review detail where they differ
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_beta_setup.py

  probe:
    name: Probe Apple's beta side (${{ matrix.platform }})
    needs: setup
    if: ${{ !cancelled() && (needs.setup.result == 'success' || needs.setup.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [IOS, MAC_OS]
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PLATFORM: ${{ matrix.platform }}
      ASC_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7
      - name: Read groups, localizations, review detail, builds and submissions
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_beta_probe.py
