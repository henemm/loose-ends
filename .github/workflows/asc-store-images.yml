# Handlauf (#842, 4c-1/4c-2): Store-Bilder einer Sprache aus docs/store/screenshots/ in Apples Asset-Bibliothek. `lesen`
# schreibt nichts bei Apple, `hochladen` legt nur Bilder in der Bibliothek an, `platzieren` (nur en) setzt die englischen
# Bilder auf die en-US-Seite der bearbeitbaren iOS-Version und ordnet sie. `plattform` mac (5b) bedient stattdessen die
# Mac-Bilder und die bearbeitbare Mac-Version. Nie einreichen, nie löschen, de-DE nie schreiben.
# concurrency hält zwei Läufe auseinander, ohne einen laufenden Schreiblauf abzubrechen.
# Der Auslöser pull_request führt nur die Tests aus und registriert die Datei für den Handlauf vom Zweig (--ref).
name: ASC Store Images

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "lesen (nur GET), hochladen (Bilder in die Bibliothek) oder platzieren (nur en, auf die en-US-Seite)"
        required: true
        default: lesen
        type: choice
        options:
          - lesen
          - hochladen
          - platzieren
      sprache:
        description: "Sprache der Bilder (en oder de)"
        required: true
        default: en
        type: choice
        options:
          - en
          - de
      plattform:
        description: "ios (iPhone, iPad, Watch) oder mac (Mac-Bilder auf die Mac-Version)"
        required: true
        default: ios
        type: choice
        options:
          - ios
          - mac
  pull_request:
    paths:
      - scripts/asc_store_images.py
      - scripts/test_asc_store_images.py
      - .github/workflows/asc-store-images.yml

permissions:
  contents: read

concurrency:
  group: asc-store-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Script tests
        run: python3 -m unittest scripts/test_asc_store_images.py
      - name: Store images in the asset library
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_POLL_SECONDS: "5"
          AKTION: ${{ inputs.aktion }}
          SPRACHE: ${{ inputs.sprache }}
          PLATTFORM: ${{ inputs.plattform }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_store_images.py "$AKTION" "$SPRACHE" "$PLATTFORM"
