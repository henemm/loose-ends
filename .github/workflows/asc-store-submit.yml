# Handlauf (#893 Schnitt A): Vorprüfung vor dem Einreichen der App-Store-Versionen beider Plattformen (IOS, MAC_OS).
# Schnitt A liest nur (GET), schreibt nichts und reicht nichts ein; Ausgang 0 nur, wenn beide Plattformen bereit sind.
# Der Auslöser pull_request führt nur die Tests aus und registriert die Datei für den Handlauf vom Zweig (--ref).
name: ASC Store Submit

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "pruefen = nur lesen: Version, Bau, Texte, Bilder, Review-Detail und Einreichungen je Plattform"
        type: choice
        options:
          - pruefen
        default: pruefen
  pull_request:
    paths:
      - scripts/asc_store_submit.py
      - scripts/test_asc_store_submit.py
      - .github/workflows/asc-store-submit.yml
      - scripts/asc_store_version.py
      - scripts/asc_version_texts.py
      - scripts/asc_beta_invite.py

permissions:
  contents: read

concurrency:
  group: asc-store-submit
  cancel-in-progress: false

jobs:
  store-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 scripts/test_asc_store_submit.py
      - name: Store submit
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_POLL_SECONDS: "5"
          AKTION: ${{ inputs.aktion }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/asc_key.p8"' EXIT
          umask 077
          printf '%s\n' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc_key.p8"
          ASC_KEY_FILE="$RUNNER_TEMP/asc_key.p8" python3 scripts/asc_store_submit.py "$AKTION"
